name: Auto Docs

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

jobs:
  generate-docs:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Generate docs artifacts
        run: node scripts/generate-docs.mjs

      - name: Upload docs artifact
        uses: actions/upload-artifact@v4
        with:
          name: auto-docs
          path: docs/auto
