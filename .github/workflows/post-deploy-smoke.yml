name: Post Deploy Smoke

on:
  push:
    branches: [ main ]
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Check required secrets
        env:
          RENDER_HEALTH_URL: ${{ secrets.RENDER_HEALTH_URL }}
          RENDER_API_BASE_URL: ${{ secrets.RENDER_API_BASE_URL }}
          FRONTEND_ORIGIN: ${{ secrets.FRONTEND_ORIGIN }}
        run: |
          set -euo pipefail
          test -n "$RENDER_HEALTH_URL"
          test -n "$RENDER_API_BASE_URL"
          test -n "$FRONTEND_ORIGIN"

      - name: Wait for Render health
        env:
          RENDER_HEALTH_URL: ${{ secrets.RENDER_HEALTH_URL }}
        run: |
          set -euo pipefail
          for i in $(seq 1 20); do
            status=$(curl -sS -o health.json -w "%{http_code}" "$RENDER_HEALTH_URL" || true)
            if [ "$status" = "200" ]; then
              echo "Health is up"
              cat health.json
              exit 0
            fi
            echo "Attempt $i/20: health status $status. Retrying in 15s..."
            sleep 15
          done
          echo "Render health did not become ready in time."
          cat health.json || true
          exit 1

      - name: Verify CORS preflight
        env:
          RENDER_API_BASE_URL: ${{ secrets.RENDER_API_BASE_URL }}
          FRONTEND_ORIGIN: ${{ secrets.FRONTEND_ORIGIN }}
        run: |
          set -euo pipefail
          status=$(curl -sS -o /tmp/preflight-body.txt -D /tmp/preflight-headers.txt \
            -X OPTIONS "${RENDER_API_BASE_URL}/auth/register" \
            -H "Origin: ${FRONTEND_ORIGIN}" \
            -H "Access-Control-Request-Method: POST" \
            -H "Access-Control-Request-Headers: content-type,authorization" \
            -w "%{http_code}")

          if [ "$status" != "204" ] && [ "$status" != "200" ]; then
            echo "Unexpected preflight status: $status"
            cat /tmp/preflight-headers.txt
            cat /tmp/preflight-body.txt
            exit 1
          fi

          if ! tr -d '\r' < /tmp/preflight-headers.txt | grep -i -q "^access-control-allow-origin: ${FRONTEND_ORIGIN}$"; then
            echo "Missing or mismatched Access-Control-Allow-Origin header"
            cat /tmp/preflight-headers.txt
            exit 1
          fi
